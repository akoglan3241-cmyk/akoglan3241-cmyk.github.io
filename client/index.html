<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Kasaba Online</title>
  </head>
  <body>
    <div id="app">
      <div id="client-shell">
        <div id="client-shell__topbar">
          <div class="client-brand">
            <div class="client-brand__mark">K</div>
            <div class="client-brand__text">
              <strong>Kasaba Online</strong>
              <span>Sosyal Dunya Istemcisi</span>
            </div>
          </div>

          <div class="client-status">
            <span class="client-chip">TR</span>
            <span class="client-chip">Desktop</span>
            <span class="client-chip client-chip--accent">Online Dunya</span>
          </div>
        </div>

        <div id="game-root"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
